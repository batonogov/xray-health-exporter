# Конфигурация Xray Health Exporter

# Глобальные значения по умолчанию (опционально)
# Эти значения будут использоваться для всех туннелей, если не переопределены
defaults:
  check_url: "https://www.google.com"
  check_interval: "30s"
  check_timeout: "30s"
  max_backoff: "5m"
  backoff_multiplier: 2.0
  check_method: "http" # http, ip или download
  # Обычный текст с IP; URL общий для прямого запроса и прокси. Кеш IP хоста — 5 минут.
  ip_check_url: "https://api.ipify.org?format=text"
  download_url: "https://proof.ovh.net/files/1Mb.dat"
  download_timeout: "60s"
  download_min_size: 51200

# Подписки: текст/Base64 (VLESS, VMess, Trojan, Shadowsocks), Xray JSON или Clash.
# При ошибке сохраняется последний рабочий список в памяти.
# Удалите демонстрационную подписку, если она не нужна: ошибка её первой загрузки блокирует запуск.
# Совпадающие туннели из разных источников проверяются один раз; разные явные имена сохраняют отдельные проверки.
subscriptions:
  - url: "https://provider.example.com/subscribe?token=replace-me"
    name: "primary"
    update_interval: "1h"
    timeout: "30s"
    format: "auto"
    # user_agent: "compatible-client"
    # headers:
    #   Authorization: "Bearer replace-me"

# Список статических туннелей для мониторинга
tunnels:
  # Первый туннель - используются все значения по умолчанию
  - name: "Server 1"
    url: "vless://your-uuid@example.com:443?type=tcp&security=reality&pbk=your-public-key&sni=google.com&fp=chrome&sid=short-id"

  # Второй туннель - с переопределением URL для проверки
  - name: "Server 2"
    url: "vless://your-uuid@example2.com:443?type=tcp&security=reality&pbk=your-public-key&sni=google.com&fp=chrome"
    check_url: "https://www.cloudflare.com"

  # Третий туннель - с переопределением таймаута и интервала
  - name: "Server 3"
    url: "vless://your-uuid@example3.com:443?type=tcp&security=tls&sni=example3.com&fp=chrome"
    check_interval: "60s"
    check_timeout: "45s"

  # Туннель без имени (будет использоваться "host:port" в качестве имени)
  - url: "vless://your-uuid@example4.com:443?type=tcp&security=reality&pbk=your-public-key&sni=google.com&fp=chrome"
    check_url: "https://1.1.1.1"

  # Туннель с кастомным SOCKS портом (опционально, по умолчанию — автоназначение)
  - name: "Server 5"
    url: "vless://your-uuid@example5.com:443?type=tcp&security=reality&pbk=your-public-key&sni=google.com&fp=chrome"
    socks_port: 2080

  # Современный XHTTP + Reality; extra передаётся в xhttpSettings без потерь
  - name: "XHTTP Server"
    url: "vless://your-uuid@example6.com:443?type=xhttp&security=reality&pbk=your-public-key&sni=example.com&fp=chrome&path=%2Fapi&mode=stream-up&extra=%7B%22xPaddingBytes%22%3A%22100-1000%22%7D"

  # gRPC + TLS; serviceName обязателен для gRPC
  - name: "gRPC Server"
    url: "vless://your-uuid@example7.com:443?type=grpc&security=tls&sni=example7.com&fp=chrome&serviceName=grpc-service&authority=example7.com"

  # Нативный Xray JSON использует протоколы/транспорты, зарегистрированные
  # во встроенной версии Xray-core из go.mod. Секции log и inbounds заменяются:
  # экспортёр добавляет собственный log и один локальный SOCKS5 inbound.
  # Остальные секции верхнего уровня, включая outbounds, сохраняются.
  - name: "Native Xray outbound"
    xray_config_file: "/etc/xray/outbound.json"

# Примечания:
# - Требуется как минимум один статический туннель или подписка
# - URL-туннель: валидная ссылка VLESS, VMess, Trojan или Shadowsocks
# - SOCKS порты назначаются автоматически начиная с 1080 (1080, 1081, 1082, ...), или можно задать явно через socks_port
# - Формат duration: "30s", "1m", "1h30m"; интервалы, таймауты и max_backoff строго положительные
